<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050810">
  <title>JARVIS - AI Voice Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at center, #102b40 0%, #050810 55%);
      color: #eafaff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 420px;
      text-align: center;
      padding: 28px 20px;
      border: 1px solid #164b66;
      border-radius: 25px;
      background: #09111cdd;
      box-shadow: 0 0 45px #00bfff18;
    }

    .status {
      color: #45e6a1;
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 25px;
    }

    .orb {
      width: 150px;
      height: 150px;
      margin: auto;
      border-radius: 50%;
      border: 2px solid #35d9ff;
      display: grid;
      place-items: center;
      color: #35d9ff;
      font-size: 48px;
      font-weight: bold;
      box-shadow:
        0 0 20px #35d9ff,
        inset 0 0 30px #35d9ff55;
      transition: .3s;
    }

    .orb.listening {
      animation: pulse 1s infinite;
      border-color: #45e6a1;
      color: #45e6a1;
      box-shadow:
        0 0 35px #45e6a1,
        inset 0 0 30px #45e6a155;
    }

    .orb.thinking {
      animation: pulse 1s infinite;
      border-color: #ffd166;
      color: #ffd166;
      box-shadow:
        0 0 35px #ffd166,
        inset 0 0 30px #ffd16655;
    }

    @keyframes pulse {
      50% {
        transform: scale(1.08);
      }
    }

    h1 {
      letter-spacing: 7px;
      margin: 25px 0 5px;
      font-size: 28px;
    }

    .subtitle {
      color: #7995aa;
      font-size: 11px;
      letter-spacing: 2px;
    }

    .panel {
      margin-top: 25px;
      text-align: left;
    }

    .label {
      color: #35d9ff;
      font-size: 10px;
      letter-spacing: 1.5px;
      margin-bottom: 7px;
    }

    .message {
      min-height: 48px;
      padding: 13px;
      border: 1px solid #1d3447;
      border-radius: 12px;
      background: #060c14;
      color: #b9cbd8;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: 1px solid #35d9ff;
      border-radius: 30px;
      background: #0b2635;
      color: #35d9ff;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
    }

    button:hover {
      background: #35d9ff;
      color: #050810;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .hint {
      margin-top: 18px;
      color: #647d91;
      font-size: 11px;
      line-height: 1.6;
    }

    .footer {
      margin-top: 25px;
      color: #40566a;
      font-size: 10px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="status" id="status">● SYSTEM READY</div>

    <div class="orb" id="orb">J</div>

    <h1>JARVIS</h1>
    <div class="subtitle">PERSONAL AI VOICE ASSISTANT</div>

    <div class="panel">
      <div class="label">YOU SAID</div>
      <div class="message" id="userText">
        Press ACTIVATE and speak...
      </div>
    </div>

    <div class="panel">
      <div class="label">JARVIS RESPONSE</div>
      <div class="message" id="jarvisText">
        Awaiting your command.
      </div>
    </div>

    <button id="activateBtn">🎙️ ACTIVATE JARVIS</button>

    <div class="hint">
      Try saying:<br>
      “Hello Jarvis” · “Explain artificial intelligence” · “Tell me a joke”
    </div>

    <div class="footer">AI CORE • VOICE MODULE • v2.0</div>

  </div>

  <script>
    // ==========================================
    // JARVIS CONFIGURATION
    // ==========================================

    const AI_BACKEND_URL =
      "https://jarvis-android-red.vercel.app/api/chat";

    // ==========================================
    // UI ELEMENTS
    // ==========================================

    const activateBtn = document.getElementById("activateBtn");
    const statusText = document.getElementById("status");
    const orb = document.getElementById("orb");
    const userText = document.getElementById("userText");
    const jarvisText = document.getElementById("jarvisText");

    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    let recognition;

    // ==========================================
    // JARVIS VOICE OUTPUT
    // ==========================================

    function speak(text) {
      if (!("speechSynthesis" in window)) {
        return;
      }

      speechSynthesis.cancel();

      const voice = new SpeechSynthesisUtterance(text);
      voice.rate = 0.95;
      voice.pitch = 1;
      voice.volume = 1;

      speechSynthesis.speak(voice);
    }

    // ==========================================
    // BASIC LOCAL COMMANDS
    // ==========================================

    function handleLocalCommand(command) {
      const text = command.toLowerCase().trim();

      if (
        text === "hello jarvis" ||
        text === "hi jarvis" ||
        text === "hello" ||
        text === "hi"
      ) {
        return "Hello Siddarth. I am online and ready.";
      }

      if (text.includes("what time") || text === "time") {
        return "The current time is " +
          new Date().toLocaleTimeString([], {
            hour: "numeric",
            minute: "2-digit"
          });
      }

      if (text.includes("what date") || text === "date") {
        return "Today is " +
          new Date().toLocaleDateString([], {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric"
          });
      }

      return null;
    }

    // ==========================================
    // REAL AI BACKEND REQUEST
    // ==========================================

    async function askJarvisAI(message) {
      try {
        statusText.textContent = "● AI THINKING...";
        statusText.style.color = "#ffd166";

        orb.classList.remove("listening");
        orb.classList.add("thinking");

        activateBtn.disabled = true;
        jarvisText.textContent = "Thinking...";

        const response = await fetch(AI_BACKEND_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "AI request failed");
        }

        const reply = data.reply || "I could not generate a response.";

        jarvisText.textContent = reply;
        speak(reply);

      } catch (error) {
        console.error("JARVIS AI Error:", error);

        jarvisText.textContent =
          "My AI brain is unavailable right now. Please check the backend connection.";

        speak("My AI brain is unavailable right now.");

      } finally {
        statusText.textContent = "● SYSTEM READY";
        statusText.style.color = "#45e6a1";

        orb.classList.remove("thinking");
        activateBtn.disabled = false;
      }
    }

    // ==========================================
    // PROCESS SPOKEN COMMAND
    // ==========================================

    async function processCommand(command) {
      userText.textContent = command;

      const localReply = handleLocalCommand(command);

      if (localReply) {
        jarvisText.textContent = localReply;
        speak(localReply);
        return;
      }

      await askJarvisAI(command);
    }

    // ==========================================
    // SPEECH RECOGNITION
    // ==========================================

    if (!SpeechRecognition) {

      statusText.textContent = "● BROWSER NOT SUPPORTED";
      statusText.style.color = "#ff6b6b";

      activateBtn.disabled = true;
      activateBtn.textContent = "VOICE NOT SUPPORTED";

      jarvisText.textContent =
        "Voice recognition is not supported in this browser. Try Chrome on Android.";

    } else {

      recognition = new SpeechRecognition();

      recognition.lang = "en-IN";
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        statusText.textContent = "● LISTENING...";
        statusText.style.color = "#45e6a1";

        orb.classList.remove("thinking");
        orb.classList.add("listening");

        activateBtn.textContent = "🔴 LISTENING...";
        activateBtn.disabled = true;
      };

      recognition.onresult = async (event) => {
        const command = event.results[0][0].transcript;

        await processCommand(command);
      };

      recognition.onerror = (event) => {
        console.error("Speech error:", event.error);

        statusText.textContent = "● VOICE ERROR";
        statusText.style.color = "#ff6b6b";

        jarvisText.textContent =
          "I could not hear you. Please try again.";
      };

      recognition.onend = () => {
        statusText.textContent = "● SYSTEM READY";
        statusText.style.color = "#45e6a1";

        orb.classList.remove("listening");

        if (!activateBtn.disabled) {
          activateBtn.textContent = "🎙️ ACTIVATE JARVIS";
        }
      };

      activateBtn.addEventListener("click", () => {

        userText.textContent = "Listening...";
        jarvisText.textContent = "Go ahead, Siddarth.";

        speak("Go ahead, Siddarth.");

        setTimeout(() => {
          try {
            recognition.start();
          } catch (error) {
            console.log("Recognition start error:", error);
          }
        }, 700);

      });

    }
  </script>

</body>
</html>
